<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Oiled Iron Plate Background -->
    <linearGradient id="plateBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171310" />
      <stop offset="60%" stop-color="#1d1713" />
      <stop offset="100%" stop-color="#120e0b" />
    </linearGradient>

    <!-- Brass & Copper Area Fill -->
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0824d" stop-opacity="0.65" />
      <stop offset="45%" stop-color="#d4a349" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#171310" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glowing Gold-Copper Stroke -->
    <linearGradient id="curveStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9e6d24" />
      <stop offset="45%" stop-color="#d4a349" />
      <stop offset="80%" stop-color="#e0824d" />
      <stop offset="100%" stop-color="#f3d08a" />
    </linearGradient>

    <!-- Subtle Drafting Grid -->
    <pattern id="chartGrid" width="40" height="32" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 32" fill="none" stroke="#d4a349" stroke-opacity="0.07" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Outer Frame & Grid -->
  <rect width="900" height="260" rx="10" fill="url(#plateBg)" />
  <rect width="900" height="260" rx="10" fill="url(#chartGrid)" />
  <rect x="1" y="1" width="898" height="258" rx="9" fill="none" stroke="#78552b" stroke-width="1.5" />

  <!-- Corner Rivets -->
  <circle cx="14" cy="14" r="3" fill="#d4a349" />
  <circle cx="886" cy="14" r="3" fill="#d4a349" />
  <circle cx="14" cy="246" r="3" fill="#d4a349" />
  <circle cx="886" cy="246" r="3" fill="#d4a349" />

  <!-- Header Bar (No Redundant Name) -->
  <circle cx="34" cy="28" r="4" fill="#e0824d">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite" />
  </circle>
  <text x="48" y="32" font-family="Courier New, monospace" font-weight="bold" font-size="13" fill="#e3b459">CUMULATIVE CONTRIBUTION TRAJECTORY  //  ROLLING 12-MONTH TELEMETRY</text>
  <text x="868" y="32" text-anchor="end" font-family="Courier New, monospace" font-weight="bold" font-size="12" fill="#cbb99d">2,540+ TOTAL COMMITS</text>

  <!-- Horizontal Reference Lines & Y-Axis Labels -->
  <g stroke="#6e532e" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="4 4">
    <line x1="64" y1="62" x2="852" y2="62" />
    <line x1="64" y1="102" x2="852" y2="102" />
    <line x1="64" y1="142" x2="852" y2="142" />
    <line x1="64" y1="182" x2="852" y2="182" />
    <line x1="64" y1="216" x2="852" y2="216" stroke-dasharray="none" stroke-opacity="0.7" />
  </g>

  <g font-family="Courier New, monospace" font-size="11" fill="#9e6d24" text-anchor="end">
    <text x="54" y="66">700</text>
    <text x="54" y="106">525</text>
    <text x="54" y="146">350</text>
    <text x="54" y="186">175</text>
    <text x="54" y="220">0</text>
  </g>

  <!-- Animated Area Under Cumulative Curve -->
  <path d="M 68 216 L 68 213 C 110 213, 145 207, 195 211 C 245 215, 290 215, 340 198 C 390 181, 425 212, 470 206 C 515 200, 540 156, 595 156 C 650 156, 680 120, 735 120 C 785 120, 815 138, 848 64 L 848 216 Z" fill="url(#areaGrad)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="4.5s" repeatCount="indefinite" />
  </path>

  <!-- Animated Drawing Cumulative Curve -->
  <path d="M 68 213 C 110 213, 145 207, 195 211 C 245 215, 290 215, 340 198 C 390 181, 425 212, 470 206 C 515 200, 540 156, 595 156 C 650 156, 680 120, 735 120 C 785 120, 815 138, 848 64" fill="none" stroke="url(#curveStroke)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="920" stroke-dashoffset="920">
    <animate attributeName="stroke-dashoffset" from="920" to="0" dur="2.2s" fill="freeze" />
  </path>

  <!-- Milestone Telemetry Nodes Along Curve -->
  <circle cx="340" cy="198" r="4" fill="#d4a349" stroke="#171310" stroke-width="1.5" />
  <circle cx="595" cy="156" r="4.5" fill="#d4a349" stroke="#171310" stroke-width="1.5" />
  <circle cx="735" cy="120" r="5" fill="#e0824d" stroke="#171310" stroke-width="1.5" />

  <!-- Pulsing Peak Beacon at Latest Surge (848, 64) -->
  <circle cx="848" cy="64" r="10" fill="none" stroke="#e0824d" stroke-width="1.5">
    <animate attributeName="r" values="5;14;5" dur="2.4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.9;0;0.9" dur="2.4s" repeatCount="indefinite" />
  </circle>
  <circle cx="848" cy="64" r="5.5" fill="#f3d08a" stroke="#e0824d" stroke-width="2" />

  <!-- Peak Callout Tag -->
  <rect x="712" y="48" width="124" height="22" rx="4" fill="#261e16" stroke="#e0824d" stroke-width="1" />
  <text x="774" y="63" text-anchor="middle" font-family="Courier New, monospace" font-weight="bold" font-size="11" fill="#f3d08a">NOV SURGE: 662+</text>

  <!-- X-Axis Month Labels -->
  <g font-family="Courier New, monospace" font-size="11" fill="#cbb99d" text-anchor="middle">
    <text x="68" y="238">DEC 25</text>
    <text x="198" y="238">FEB 26</text>
    <text x="328" y="238">APR 26</text>
    <text x="458" y="238">JUN 26</text>
    <text x="588" y="238">AUG 26</text>
    <text x="718" y="238">OCT 26</text>
    <text x="848" y="238">NOV 26</text>
  </g>
</svg>
