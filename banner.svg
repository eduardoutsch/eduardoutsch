  </circle>
  <circle cx="860" cy="95" r="4.5" fill="#38bdf8">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" repeatCount="indefinite" />
  </circle>
  <circle cx="845" cy="155" r="4.5" fill="#10b981">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite" />
  </circle>

  <rect x="46" y="36" width="302" height="26" rx="13" fill="#06281e" stroke="#10b981" stroke-opacity="0.6" />
  <circle cx="62" cy="49" r="4.5" fill="#10b981">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="76" y="53" font-family="monospace" font-size="11.5" font-weight="bold" fill="#6ee7b7">PUC MINAS // COMPUTER ENGINEERING</text>

