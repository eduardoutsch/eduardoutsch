<svg width="900" height="230" viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080f" />
      <stop offset="50%" stop-color="#0a1324" />
      <stop offset="100%" stop-color="#061614" />
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="30%" stop-color="#10b981" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="55%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#10b981" stroke-opacity="0.09" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="900" height="230" rx="14" fill="url(#bgGrad)" />
  <rect width="900" height="230" rx="14" fill="url(#grid)" />

  <rect x="-180" y="0" width="180" height="230" fill="url(#accentLine)" opacity="0.16">
    <animate attributeName="x" from="-180" to="920" dur="5s" repeatCount="indefinite" />
  </rect>

  <rect x="1" y="1" width="898" height="228" rx="13" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <rect x="0" y="0" width="900" height="3" fill="url(#accentLine)" />
  <rect x="0" y="227" width="900" height="3" fill="url(#accentLine)" />

  <g stroke="#10b981" stroke-opacity="0.45" stroke-width="1.5" fill="none" stroke-dasharray="8 6">
    <path d="M 610 45 H 705 L 730 70 H 845">
      <animate attributeName="stroke-dashoffset" from="0" to="-280" dur="14s" repeatCount="indefinite" />
    </path>
    <path d="M 635 115 H 740 L 760 95 H 860">
      <animate attributeName="stroke-dashoffset" from="0" to="-280" dur="11s" repeatCount="indefinite" />
    </path>
    <path d="M 600 185 H 715 L 745 155 H 845">
      <animate attributeName="stroke-dashoffset" from="0" to="-280" dur="16s" repeatCount="indefinite" />
